name: "CI — fin-db (SQL Migrations & Schema Integrity)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-migrations:
    name: "Validate SQL Migrations Syntax & Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify Migration Files Syntax
        run: |
          uv run --with "psycopg[binary]" scripts/migrate.py --dry-run
